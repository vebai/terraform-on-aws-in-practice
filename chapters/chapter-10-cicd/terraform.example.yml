name: Terraform
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
env:
  TF_VERSION: "1.16.3"
  TF_VAR_environment: dev
permissions:
  contents: read
jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format Check
        run: terraform fmt -check -recursive
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Validate
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate
  pr_plan:
    name: PR Plan
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-terraform-plan
          aws-region: us-east-1
      - name: Initialise Terraform
        run: terraform init -lockfile=readonly
      - name: Plan
        id: plan
        run: terraform plan -lock-timeout=5m -no-color
  post_merge_plan:
    name: Post-Merge Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-terraform-plan
          aws-region: us-east-1
      - name: Initialise Terraform
        run: terraform init -lockfile=readonly
      - name: Plan
        id: post_merge_plan
        run: terraform plan -lock-timeout=5m -out=reviewed.tfplan -no-color
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-plan
          path: reviewed.tfplan
          retention-days: 1
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: post_merge_plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: terraform-apply
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-terraform-apply
          aws-region: us-east-1
      - name: Initialise Terraform
        run: terraform init -lockfile=readonly
      - name: Download Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: reviewed-plan
      - name: Apply
        run: terraform apply reviewed.tfplan
