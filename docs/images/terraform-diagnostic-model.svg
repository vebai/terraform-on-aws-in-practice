="52" font-weight="400" fill="#0c1b51" text-anchor="middle">aws</text><text x="1269" y="502" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#0b1b50" text-anchor="middle">Real infrastructure</text><text x="1269" y="531" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#0b1b50" text-anchor="middle">in your AWS account</text><text x="517" y="348" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#0b1b50" text-anchor="middle">Compare</text><text x="517" y="372" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#0b1b50" text-anchor="middle">in a plan</text><line x1="490" y1="411" x2="544" y2="411" stroke="#122960" stroke-width="7" stroke-linecap="round"/><path d="M 527 398 L 544 411 L 527 424" fill="none" stroke="#122960" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 507 398 L 490 411 L 507 424" fill="none" stroke="#122960" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="1018" y="348" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#0b1b50" text-anchor="middle">Compare</text><text x="1018" y="372" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#0b1b50" text-anchor="middle">in a plan</text><line x1="991" y1="411" x2="1045" y2="411" stroke="#122960" stroke-width="7" stroke-linecap="round"/><path d="M 1028 398 L 1045 411 L 1028 424" fill="none" stroke="#122960" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 1008 398 L 991 411 L 1008 424" fill="none" stroke="#122960" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect x="46" y="575" width="1444" height="99" rx="19" fill="#f2e9ff" stroke="#ae78fc" stroke-width="2"/><text x="280" y="637" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#542baf" text-anchor="middle">Diagnostic question:</text><text x="944" y="637" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#091b50" text-anchor="middle">Which perspective no longer agrees with the other two?</text><rect x="41" y="699" width="717" height="289" rx="18" fill="#edf9f2" stroke="#87daa2" stroke-width="2"/><circle cx="106" cy="752" r="38" fill="#26ae78"/><text x="106" y="766" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="183" y="750" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#101a51" text-anchor="start">All three are aligned</text><text x="183" y="789" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#101a51" text-anchor="start">Terraform behaves as expected.</text><rect x="65" y="819" width="208" height="140" rx="12" fill="#edf4ff" stroke="#c9d9e4" stroke-width="2"/><text x="169" y="879" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#142253" text-anchor="middle">Configuration</text><text x="169" y="916" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#142253" text-anchor="middle">Matches</text><text x="285" y="887" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#142253" text-anchor="middle">↔</text><rect x="294" y="819" width="208" height="140" rx="12" fill="#e3f9ed" stroke="#c9d9e4" stroke-width="2"/><text x="398" y="879" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#142253" text-anchor="middle">State</text><text x="398" y="916" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#142253" text-anchor="middle">Matches</text><text x="514" y="887" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#142253" text-anchor="middle">↔</text><rect x="523" y="819" width="208" height="140" rx="12" fill="#fff6ed" stroke="#c9d9e4" stroke-width="2"/><text x="627" y="879" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#142253" text-anchor="middle">AWS</text><text x="627" y="916" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#142253" text-anchor="middle">Matches</text><rect x="777" y="699" width="717" height="289" rx="18" fill="#fff0f1" stroke="#f6a1af" stroke-width="2"/><circle cx="842" cy="752" r="38" fill="#ef424c"/><text x="842" y="766" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#fff" text-anchor="middle">!</text><text x="919" y="750" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#101a51" text-anchor="start">A mismatch exists</text><text x="919" y="789" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#101a51" text-anchor="start">The difference points to a problem to investigate.</text><rect x="801" y="819" width="208" height="140" rx="12" fill="#edf4ff" stroke="#c9d9e4" stroke-width="2"/><text x="905" y="879" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#142253" text-anchor="middle">Configuration</text><text x="905" y="916" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#142253" text-anchor="middle">Check reality</text><text x="1021" y="887" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#e83342" text-anchor="middle">×</text><rect x="1030" y="819" width="208" height="140" rx="12" fill="#e3f9ed" stroke="#c9d9e4" stroke-width="2"/><text x="1134" y="879" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#142253" text-anchor="middle">State</text><text x="1134" y="916" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#142253" text-anchor="middle">Recorded</text><text x="1250" y="887" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#e83342" text-anchor="middle">×</text><rect x="1259