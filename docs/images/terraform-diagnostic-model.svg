<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc"><title id="title">Terraform Configuration, State, and AWS diagnostic model</title><desc id="desc">Compare the Terraform configuration, state file, and AWS reality. When they align, infrastructure behaves as expected; when they differ, investigate the mismatch before applying a change.</desc><rect x="0" y="0" width="1536" height="1024" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><rect x="275" y="17" width="986" height="105" rx="20" fill="#d7edfb" stroke="#d7edfb" stroke-width="0"/><text x="768" y="91" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="700" fill="#0a1e56" text-anchor="middle">The Diagnostic Model</text><text x="768" y="153" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#0a1e56" text-anchor="middle">Use three perspectives to understand Terraform behaviour and find problems.</text><rect x="45" y="189" width="444" height="364" rx="20" fill="#e7f5ff" stroke="#48bbf4" stroke-width="2"/><text x="267" y="254" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#08194e" text-anchor="middle">CONFIGURATION</text><text x="267" y="302" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" fill="#0b1b50" text-anchor="middle">What you want</text><rect x="196" y="347" width="142" height="127" rx="12" fill="#ffffff" stroke="#244eac" stroke-width="6"/><text x="267" y="426" font-family="Arial,Helvetica,sans-serif" font-size="61" font-weight="700" fill="#285dde" text-anchor="middle">&lt;/&gt;</text><text x="267" y="502" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#0b1b50" text-anchor="middle">Terraform configuration</text><text x="267" y="531" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#0b1b50" text-anchor="middle">files (HCL)</text><rect x="546" y="189" widt